name: Samantha original-code validation
on:
  workflow_dispatch:
  push:
    branches: [refactor/modular-layout]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check unchanged runtime syntax
        run: python -m compileall -q bot.py config.py database.py ags_indexer.py parser.py samantha_logs.py
      - name: Verify original bot is byte-identical to main
        run: |
          git fetch origin main
          test "$(git hash-object bot.py)" = "$(git rev-parse origin/main:bot.py)"
          test "$(git hash-object config.py)" = "$(git rev-parse origin/main:config.py)"
          test "$(git hash-object database.py)" = "$(git rev-parse origin/main:database.py)"
          test "$(git hash-object ags_indexer.py)" = "$(git rev-parse origin/main:ags_indexer.py)"
          test "$(git hash-object parser.py)" = "$(git rev-parse origin/main:parser.py)"
          test "$(git hash-object samantha_logs.py)" = "$(git rev-parse origin/main:samantha_logs.py)"
