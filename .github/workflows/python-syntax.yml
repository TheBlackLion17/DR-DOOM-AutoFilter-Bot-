name: Samantha Python syntax
on:
  push:
    branches: [main, refactor/modular-layout]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all tracked Python modules
        run: python -m compileall -q bot.py core.py plugins database.py ags_indexer.py parser.py samantha_logs.py
